<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="EchoCad">
  <!-- Planet QGIS 구독자 목록용 로고. src/echocad/icon.png(64x64) 의 큰 그림을
       선으로 다시 그렸다(저장소가 svg 를 받는다: data/subscribers.json 의 4개 확장자 중 하나).
       원본이 64px 라 그냥 확대하면 뭉개진다. -->
  <rect x="10" y="10" width="236" height="236" rx="34" fill="#f2f2f0" stroke="#1c1f24" stroke-width="12"/>
  <!-- 파란 모서리 괄호 -->
  <path d="M58 52 v104 M58 52 h78" fill="none" stroke="#2f6fd0" stroke-width="13" stroke-linecap="round"/>
  <!-- 스냅 포인트 셋과 연결선 -->
  <path d="M143 96 v34 M143 130 h40" fill="none" stroke="#2f6fd0" stroke-width="8" stroke-dasharray="3 11" stroke-linecap="round"/>
  <circle cx="143" cy="92" r="13" fill="#2e8b3d"/>
  <circle cx="143" cy="134" r="13" fill="#2e8b3d"/>
  <circle cx="188" cy="134" r="13" fill="#2e8b3d"/>
  <!-- 빨간 표(속성 테이블) 글리프 -->
  <g>
    <rect x="176" y="46" width="46" height="38" rx="4" fill="#c2352c"/>
    <path d="M183 58 h32 M183 68 h32 M183 78 h20" stroke="#f2f2f0" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- 아래 치수선 -->
  <path d="M62 204 h124 M62 194 v20 M186 194 v20" fill="none" stroke="#1c1f24" stroke-width="8" stroke-linecap="round"/>
</svg>
